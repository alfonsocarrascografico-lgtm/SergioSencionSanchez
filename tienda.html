<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda — Sergio Sención Sánchez Distribuciones</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand" aria-label="Sergio Sención Sánchez Distribuciones - Inicio">
      <img
        src="logo sergio.png"
        alt="Sergio Sención Sánchez Distribuciones"
        class="brand-logo"
      />
    </a>

    <nav class="main-nav" aria-label="Secciones principales">
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="tienda.html" class="nav-link active">Tienda</a>
      <a href="index.html#envios" class="nav-link">Envíos</a>
      <a href="index.html#recetas" class="nav-link">Recetas</a>
      <a href="index.html#contacto" class="nav-link">Contacto</a>
    </nav>

    <div class="topbar-actions">
      <a href="index.html#tienda" class="btn btn-outline" style="padding: 7px 12px; font-size: 0.85rem;">← Volver</a>

      <button type="button" id="open-cart-btn" class="cart-btn" aria-label="Abrir carrito">
        <span class="cart-label">Carrito</span>
        <span id="cart-count" class="badge">0</span>
      </button>

      <button
        type="button"
        id="mobile-menu-btn"
        class="menu-toggle"
        aria-label="Abrir menú de navegación"
        aria-expanded="false"
        aria-controls="mobile-drawer"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div id="scroll-progress" class="progress-fill" style="width: 100%;"></div>
    </div>
  </header>

  <!-- MENÚ DESPLEGABLE PARA MÓVILES -->
  <nav id="mobile-drawer" class="mobile-drawer" aria-label="Navegación móvil" aria-hidden="true">
    <a href="index.html" class="mobile-link">Inicio</a>
    <a href="tienda.html" class="mobile-link active">Tienda</a>
    <a href="index.html#envios" class="mobile-link">Envíos</a>
    <a href="index.html#recetas" class="mobile-link">Recetas</a>
    <a href="index.html#contacto" class="mobile-link">Contacto</a>
  </nav>

  <main id="horizontal-stage" class="stage" tabindex="0">
    <!-- CATÁLOGO COMPLETO -->
    <section id="tienda" class="panel panel-store is-visible" data-index="0">
      <div class="panel-inner column-layout">
        <header class="section-header reveal">
          <div>
            <span class="kicker">Catálogo Mayorista y Profesional</span>
            <h2>Insumos para panificación y repostería</h2>
          </div>
          <div class="filter-bar" role="group" aria-label="Filtrar catálogo">
            <button type="button" class="filter-pill active" data-category="todos">Todos</button>
            <button type="button" class="filter-pill" data-category="harinas">Harinas y Premezclas</button>
            <button type="button" class="filter-pill" data-category="especiales">Dietas Especiales</button>
            <button type="button" class="filter-pill" data-category="reposteria">Repostería</button>
          </div>
        </header>

        <div id="product-grid" class="store-grid reveal delay-1"></div>
      </div>
    </section>
  </main>

  <!-- OVERLAY OSCURO PARA DRAWERS Y MODALES -->
  <div id="backdrop" class="backdrop" hidden></div>

  <!-- MODAL FICHA TÉCNICA DE PRODUCTO -->
  <div
    id="tech-modal"
    class="tech-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tech-modal-title"
    aria-hidden="true"
    hidden
  >
    <div class="tech-modal-header">
      <span class="tag" id="tech-modal-category">Ficha Técnica</span>
      <button type="button" id="close-tech-btn" class="icon-close" aria-label="Cerrar ficha técnica">✕</button>
    </div>

    <div class="tech-modal-body">
      <div class="tech-modal-media" id="tech-modal-media"></div>

      <div class="tech-modal-info">
        <span class="product-meta" id="tech-modal-unit"></span>
        <h3 id="tech-modal-title"></h3>
        <div class="product-price" id="tech-modal-price"></div>

        <dl class="tech-specs" id="tech-modal-specs"></dl>

        <div class="tech-modal-actions">
          <button type="button" id="tech-modal-add-btn" class="btn btn-primary btn-full">
            Agregar al pedido
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- DRAWER CARRITO -->
  <aside id="cart-drawer" class="cart-drawer" aria-label="Carrito de compras" aria-hidden="true">
    <div class="cart-header">
      <h3>Pedido actual</h3>
      <button type="button" id="close-cart-btn" class="icon-close" aria-label="Cerrar carrito">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-intent-options" role="radiogroup" aria-label="Tipo de envío">
        <label class="cart-intent-option">
          <input type="radio" name="cart-intent" value="Pedido" checked />
          <span>Pedido</span>
        </label>
        <label class="cart-intent-option">
          <input type="radio" name="cart-intent" value="Consulta" />
          <span>Consulta</span>
        </label>
      </div>
      <div class="cart-buyer-fields">
        <label class="cart-field">
          <span>Nombre o comercio</span>
          <input type="text" id="cart-customer-name" placeholder="Ej. Panadería Central" />
        </label>
        <label class="cart-field">
          <span>Localidad / envío</span>
          <input type="text" id="cart-customer-location" placeholder="Ej. Durazno / Agencia" />
        </label>
      </div>
      <div class="cart-subtotal">
        <span>Subtotal estimado</span>
        <strong id="cart-total">$0</strong>
      </div>
      <button type="button" id="checkout-btn" class="btn btn-primary btn-full">Finalizar pedido</button>
      <p id="checkout-msg" class="checkout-msg" aria-live="polite"></p>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
